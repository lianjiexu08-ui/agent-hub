<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="description" content="AI 驱动的多智能体研发协作平台：需求理解、计划、执行、测试、评审由智能体完成，人只负责需求确认与最终验收。" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#fbfbfa" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e0e10" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Ccircle cx='11' cy='19' r='3' fill='%23fff'/%3E%3Ccircle cx='22' cy='11' r='2' fill='%23fff'/%3E%3Ccircle cx='22' cy='22' r='2' fill='%23fff' opacity='.8'/%3E%3C/svg%3E">
<title>Agent Hub</title>
<link rel="stylesheet" href="/assets/styles.css">
<link rel="stylesheet" href="/assets/login.css">
</head>
<body>
<a class="skiplink" href="#main">跳到主内容</a>
<aside class="sidebar" aria-label="主导航">
  <div class="sb-top">
    <div class="logo"><span class="logo-mark"></span><h1>Agent Hub</h1></div>
    <div class="proj-switch" id="projSwitch"><button class="proj-btn" id="projBtn"></button><div class="menu" id="projMenu"></div></div>
  </div>
  <nav aria-label="主导航">
    <div class="nav-group">工作</div>
    <button data-view="home" class="active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>首页</button>
    <button data-view="issues"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/></svg>工作项</button>
    <button data-view="center"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>任务中心</button>
    <button data-view="testing"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>测试</button>
    <div class="nav-group">运营</div>
    <button data-view="automation"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>自动化</button>
    <button data-view="insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/></svg>洞察</button>
    <button data-view="tasks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h10M4 18h13"/></svg>调用记录</button>
    <div class="nav-group">配置</div>
    <button data-view="config"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.5a6.5 6.5 0 0 1 3.5 5.5"/></svg>智能体与工具</button>
    <button data-view="project"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>项目设置</button>
    <button data-view="settings" id="settingsBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>设置</button>
  </nav>
  <div class="sb-foot">
    <button class="sb-btn" id="bellBtn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9a6 6 0 0 1 12 0c0 6 2.5 7 2.5 7h-17S6 15 6 9M10 20a2 2 0 0 0 4 0"/></svg>通知<span class="count" id="bellCount"></span></button>
    <div class="conn"><span class="dot" id="dot"></span><span id="connText">未连接</span><button id="tokenBtn">令牌</button></div>
  </div>
</aside>
<div class="menu notif-panel" id="notifPanel"></div>

<main id="main" tabindex="-1">
  <!-- 任务 -->
  <!-- 工作项 -->
  <!-- 首页：管家 -->
  <section class="view active" id="view-home">
    <div class="home">
      <div class="home-chat" id="homeChat"></div>
      <div class="home-side" id="homeSide"></div>
    </div>
  </section>

  <section class="view" id="view-issues">
    <div class="col grow board-wrap">
      <div class="toolbar">
        <span class="projbar" id="projBar"></span>
        <input id="issueSearch" placeholder="搜索工作项…  /" />
        <select id="issueAssignee"></select>
        <label class="chk"><input type="checkbox" id="showCanceled" /> 显示已取消</label>
        <span class="spacer"></span>
        <button class="hotfix" id="hotfixBtn" title="紧急修复：创建后直接进入进行中">⚡ Hotfix</button>
        <button class="primary" id="newIssueBtn">+ 新建工作项<kbd>C</kbd></button>
      </div>
      <div class="board" id="board"></div>
    </div>
  </section>

  <!-- 测试 -->
  <section class="view" id="view-testing"><div class="col grow center-page" id="testingPage"></div></section>

  <!-- 洞察 -->
  <section class="view" id="view-insights"><div class="col grow center-page" id="insightsPage"></div></section>

  <!-- 自动化：哨兵 + 定时任务 -->
  <section class="view" id="view-automation"><div class="col grow center-page" id="automationPage"></div></section>

  <!-- 项目设置 / 全局设置 -->
  <section class="view" id="view-project"><div class="col grow studio-main" id="projectPage"></div></section>
  <section class="view" id="view-settings"><div class="col grow studio-main" id="settingsPage"></div></section>

  <!-- 运行中心 -->
  <section class="view" id="view-center">
    <div class="col grow center-page" id="center"></div>
  </section>

  <section class="view" id="view-tasks">
    <div class="col side">
      <div class="row" style="justify-content:space-between">
        <div class="seg"><button class="on">调用记录</button><button onclick="showView('bus')">总线消息</button></div>
        <select id="statusFilter" style="width:auto">
          <option value="">全部</option><option value="running">运行中</option><option value="completed">已完成</option>
          <option value="failed">失败</option><option value="cancelled">已取消</option>
        </select>
      </div>
      <div id="rootList"></div>
    </div>
    <div class="col grow">
      <div id="treeHeader"></div>
      <div class="tree" id="tree"><div class="empty">选择一个运行查看调用树</div></div>
    </div>
    <div class="col detail" id="detail"><div class="empty">选择节点查看详情</div></div>
  </section>

  <!-- 总线 -->
  <section class="view" id="view-bus">
    <div class="col side">
      <div class="seg" style="margin-bottom:6px"><button onclick="showView('tasks')">调用记录</button><button class="on">总线消息</button></div>
      <div class="muted" style="font-size:12px;margin:6px 0 4px">智能体之间互相发送消息的内部通道（发布 / 订阅），用于排查协作过程</div>
      <div class="section-title" style="margin-top:8px">主题</div>
      <div id="topicList"></div>
    </div>
    <div class="col grow">
      <div class="card">
        <div class="row"><input id="pubTopic" placeholder="主题" style="width:200px" /><span class="muted">发布后订阅者会被唤醒</span></div>
        <textarea id="pubContent" placeholder="消息内容" style="margin-top:6px"></textarea>
        <div class="row" style="margin-top:6px; justify-content:flex-end"><button class="primary" id="pubBtn">发布</button></div>
      </div>
      <div id="busMessages"></div>
    </div>
  </section>

  <!-- 配置 -->
  <section class="view" id="view-config">
    <div class="col side studio-side" id="studioSide"></div>
    <div class="col grow studio-main" id="studioMain"></div>
  </section>
</main>

<div class="scrim" id="scrim" aria-hidden="true"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="工作项详情" aria-hidden="true" tabindex="-1"></aside>
<aside class="drawer" id="qaDrawer" role="dialog" aria-modal="true" aria-label="验收详情" aria-hidden="true" tabindex="-1"></aside>
<div class="modal-wrap" id="modal" role="dialog" aria-modal="true" aria-label="对话框" aria-hidden="true" tabindex="-1"></div>
<div class="toasts" id="toasts" role="status" aria-live="polite"></div>

<script src="/assets/app.js" defer></script>
</body>
</html>
