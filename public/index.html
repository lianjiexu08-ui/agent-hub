<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent Hub</title>
<style>
:root {
  --bg: #fbfbfa; --side: #f4f4f1; --panel: #ffffff; --panel-2: #f3f3f0; --hover: #ecece8;
  --border: #e6e6e1; --border-strong: #d3d3cc;
  --text: #1c1c19; --muted: #6e6e66; --dim: #a2a29a;
  --accent: #4f46e5; --accent-soft: rgba(79, 70, 229, 0.09); --on-accent: #ffffff;
  --code: #f3f3f0;
  --pending: #8a8a82; --running: #2563eb; --completed: #15803d; --failed: #dc2626; --cancelled: #c2710c; --review: #7c3aed;
  --shadow-sm: 0 1px 2px rgba(20, 20, 15, 0.05);
  --shadow-lg: 0 16px 40px rgba(20, 20, 15, 0.13), 0 2px 8px rgba(20, 20, 15, 0.06);
  --av-l: 92%; --av-t: 32%; --av-s: 55%;
  --sans: -apple-system, BlinkMacSystemFont, "Inter", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0e10; --side: #121215; --panel: #18181b; --panel-2: #1d1d21; --hover: #232328;
    --border: #27272c; --border-strong: #37373e;
    --text: #ededf0; --muted: #92929b; --dim: #5f5f68;
    --accent: #8b8ff5; --accent-soft: rgba(139, 143, 245, 0.14); --on-accent: #ffffff;
    --code: #202024;
    --pending: #8b8d95; --running: #60a5fa; --completed: #4ade80; --failed: #f87171; --cancelled: #fbbf24; --review: #a78bfa;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.3);
    --av-l: 26%; --av-t: 80%; --av-s: 40%;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--text); font: 13.5px/1.55 var(--sans); display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
button, select, textarea, input { font: inherit; color: inherit; }
button {
  background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 5px 12px; cursor: pointer;
  font-size: 13px; line-height: 1.4; box-shadow: var(--shadow-sm); transition: background .12s, border-color .12s;
}
button:hover { background: var(--hover); border-color: var(--border-strong); }
button:disabled { opacity: .55; cursor: wait; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 500; }
button.primary:hover { filter: brightness(1.06); background: var(--accent); }
button.danger { color: var(--failed); }
button.danger:hover { background: color-mix(in srgb, var(--failed) 8%, var(--panel)); border-color: color-mix(in srgb, var(--failed) 40%, var(--border)); }
select, textarea, input {
  background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 9px; width: 100%;
  outline: none; transition: border-color .12s, box-shadow .12s;
}
select:focus, textarea:focus, input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; min-height: 72px; }
textarea::placeholder, input::placeholder { color: var(--dim); }
pre, code { font-family: var(--mono); font-size: 12px; }
pre { background: var(--code); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; white-space: pre-wrap; word-break: break-word; margin: 4px 0; max-height: 420px; overflow: auto; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* ---------- 顶栏 ---------- */
header { display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 52px; flex-wrap: wrap; background: var(--panel); border-bottom: 1px solid var(--border); }
.logo { display: flex; align-items: baseline; gap: 8px; }
.logo h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
.logo span { font-size: 12px; color: var(--muted); }
nav { display: flex; gap: 2px; }
nav button { border: none; background: none; box-shadow: none; color: var(--muted); padding: 6px 10px; font-weight: 500; white-space: nowrap; }
nav button:hover { background: var(--hover); color: var(--text); }
nav button.active { background: var(--panel-2); color: var(--text); }
.conn { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--failed); }
.dot.on { background: var(--completed); }

/* ---------- 布局 ---------- */
main { flex: 1; min-height: 0; display: flex; }
.view { display: none; flex: 1; min-height: 0; }
.view.active { display: flex; }
.col { min-height: 0; overflow: auto; padding: 16px; }
.side { width: 340px; border-right: 1px solid var(--border); flex-shrink: 0; background: var(--panel); }
.grow { flex: 1; min-width: 0; }
.detail { width: 44%; border-left: 1px solid var(--border); flex-shrink: 0; background: var(--panel); }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow-sm); }
.section-title { margin: 18px 0 8px; font-size: 12px; font-weight: 600; color: var(--muted); }
.section-title.s-failed { color: var(--failed); }
.muted { color: var(--muted); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.empty { color: var(--dim); padding: 40px 16px; text-align: center; font-size: 13px; }

/* ---------- 状态 ---------- */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 0 8px; height: 20px; border-radius: 999px; white-space: nowrap; background: color-mix(in srgb, currentColor 12%, transparent); font-weight: 500; }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.s-pending { color: var(--pending); } .s-running { color: var(--running); } .s-completed { color: var(--completed); }
.s-failed { color: var(--failed); } .s-cancelled { color: var(--cancelled); }
.badge.s-running::before { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.tag { font-size: 11.5px; padding: 0 6px; height: 20px; display: inline-flex; align-items: center; border-radius: 4px; color: var(--muted); background: var(--panel-2); border: 1px solid var(--border); white-space: nowrap; font-family: var(--mono); }

/* ---------- 运行列表 ---------- */
.task-item { padding: 9px 10px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; margin-bottom: 2px; }
.task-item:hover { background: var(--hover); }
.task-item.sel { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.task-item b { font-weight: 600; }
.task-item .input { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; margin-top: 3px; color: var(--muted); }

/* ---------- 统计 ---------- */
.hud { display: flex; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; margin-bottom: 14px; overflow: hidden; box-shadow: var(--shadow-sm); }
.stat { flex: 1 1 92px; padding: 10px 14px; border-right: 1px solid var(--border); margin-right: -1px; }
.stat .k { font-size: 12px; color: var(--muted); }
.stat .v { font-size: 18px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.stat .v.s-failed { color: var(--failed); } .stat .v.s-completed { color: var(--completed); }
.stat .v.s-cancelled { color: var(--cancelled); } .stat .v.s-running { color: var(--running); } .stat .v.s-pending { color: var(--pending); }
.hud-actions { display: flex; align-items: center; justify-content: flex-end; }

/* ---------- 调用树 ---------- */
.tree ul { list-style: none; padding-left: 24px; margin: 0; position: relative; }
.tree ul::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 18px; width: 1px; background: var(--border-strong); }
.tree > ul { padding-left: 0; }
.tree > ul::before { display: none; }
.tree li { position: relative; }
.tree ul ul > li::before { content: ""; position: absolute; left: -14px; top: 19px; width: 12px; height: 1px; background: var(--border-strong); }
.node { display: flex; gap: 10px; align-items: center; padding: 7px 10px; cursor: pointer; margin: 4px 0; flex-wrap: wrap; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; transition: border-color .12s, background .12s; }
.node:hover { border-color: var(--border-strong); background: var(--hover); }
.node.sel { border-color: var(--accent); background: var(--accent-soft); }
.node.running { box-shadow: inset 2px 0 0 var(--running); }
.node .agent { font-weight: 600; }
.node .snippet { color: var(--muted); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 120px; }

/* ---------- 详情与对话 ---------- */
.detail-head { display: flex; align-items: center; gap: 10px; }
.detail-head b { font-size: 16px; font-weight: 600; }
.msg { padding: 2px 0 2px 12px; margin: 12px 0; border-left: 2px solid var(--border-strong); }
.msg.assistant { border-color: var(--accent); }
.msg .role { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.tool { font-size: 13px; margin: 4px 0; }
.tool b { font-family: var(--mono); font-weight: 500; color: var(--accent); }
.tool.err b { color: var(--failed); }
details summary { cursor: pointer; }
.text { white-space: pre-wrap; word-break: break-word; }
.bus-msg { padding: 10px 0; border-bottom: 1px solid var(--border); }
.bus-msg b { font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.grid .card > b { font-size: 14px; font-weight: 600; }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 4px 10px; font-size: 13px; }
.kv > * { min-width: 0; overflow-wrap: anywhere; }
.kv > :nth-child(odd) { color: var(--muted); font-size: 12.5px; }

/* ---------- 工作项看板 ---------- */
.board-wrap { display: flex; flex-direction: column; padding: 0; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--panel); }
.toolbar #issueSearch { width: 240px; }
.toolbar select { width: auto; }
.toolbar .spacer { flex: 1; }
.proto-flag { font-size: 11.5px; color: var(--cancelled); background: color-mix(in srgb, var(--cancelled) 12%, transparent); padding: 2px 8px; border-radius: 999px; white-space: nowrap; font-weight: 500; }
.chk { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; cursor: pointer; white-space: nowrap; }
.chk input { width: auto; accent-color: var(--accent); box-shadow: none; }
kbd { font-family: var(--mono); font-size: 10.5px; padding: 0 4px; border: 1px solid currentColor; border-radius: 3px; opacity: .6; margin-left: 6px; }
.board { flex: 1; min-height: 0; display: flex; gap: 12px; padding: 16px; overflow-x: auto; align-items: stretch; }
.bcol { flex: 0 0 286px; display: flex; flex-direction: column; min-height: 0; background: var(--panel-2); border: 1px solid transparent; border-radius: 10px; transition: border-color .12s, background .12s; }
.bcol.over { border-color: var(--accent); background: var(--accent-soft); }
.bcol-head { display: flex; align-items: center; gap: 8px; padding: 10px 12px 6px; font-size: 13px; font-weight: 600; }
.bcol-head .count { color: var(--muted); font-weight: 400; }
.icon-btn { margin-left: auto; padding: 0 7px; border: none; background: none; box-shadow: none; color: var(--muted); font-size: 16px; line-height: 22px; }
.icon-btn:hover { color: var(--text); }
.bcol-body { flex: 1; overflow-y: auto; padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 6px; }
.bcol-empty { color: var(--dim); font-size: 12px; text-align: center; padding: 20px 0; border: 1px dashed var(--border-strong); border-radius: 6px; }
.sicon { font-size: 13px; width: 15px; text-align: center; flex-shrink: 0; }
.st-backlog { color: var(--muted); } .st-todo { color: var(--muted); } .st-in_progress { color: var(--running); }
.st-in_review { color: var(--review); } .st-done { color: var(--completed); } .st-canceled { color: var(--dim); }
.icard { padding: 10px 12px; cursor: grab; background: var(--panel); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow-sm); transition: border-color .12s; }
.icard:hover { border-color: var(--border-strong); }
.icard.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.icard.dragging { opacity: .4; }
.icard.running { box-shadow: inset 2px 0 0 var(--running), var(--shadow-sm); }
.icard.done .ititle { color: var(--muted); }
.icard-top { display: flex; align-items: center; gap: 8px; min-height: 20px; }
.ikey { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ititle { margin: 5px 0 6px; font-size: 13.5px; line-height: 1.45; font-weight: 500; }
.imeta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.imeta:empty { display: none; }
.label { font-size: 11.5px; padding: 0 7px; height: 20px; display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); border-radius: 999px; color: var(--muted); white-space: nowrap; }
.label::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--review); }
.label.hot { color: #fff; background: var(--failed); border-color: var(--failed); font-weight: 600; }
.label.hot::before { display: none; }
button.hotfix { color: var(--failed); border-color: color-mix(in srgb, var(--failed) 40%, var(--border)); }
button.hotfix:hover { background: color-mix(in srgb, var(--failed) 8%, var(--panel)); }
.live { font-size: 11.5px; color: var(--running); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
.live::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; animation: pulse 1.4s ease-in-out infinite; }
.warn { font-size: 11.5px; color: var(--failed); white-space: nowrap; }
.prio { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; flex-shrink: 0; }
.prio i { width: 3px; border-radius: 1px; background: var(--border-strong); }
.prio i:nth-child(1) { height: 5px; } .prio i:nth-child(2) { height: 8px; } .prio i:nth-child(3) { height: 12px; }
.prio i.on { background: var(--muted); }
.prio.p1 { height: 14px; width: 14px; justify-content: center; align-items: center; font-size: 10px; font-weight: 700; color: #fff; background: var(--failed); border-radius: 3px; }
.prio.p0 { height: auto; color: var(--dim); font-size: 11px; letter-spacing: 1px; }
.avatar { --hue: 210; width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; flex-shrink: 0; font-size: 10.5px; font-weight: 600; color: hsl(var(--hue) var(--av-s) var(--av-t)); background: hsl(var(--hue) var(--av-s) var(--av-l)); }
.avatar.none { color: var(--dim); background: none; border: 1px dashed var(--border-strong); }
.who { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; }

/* ---------- 详情抽屉 ---------- */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.2); opacity: 0; pointer-events: none; transition: opacity .18s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: min(640px, 100vw); overflow-y: auto; padding: 16px 24px 48px; background: var(--panel); border-left: 1px solid var(--border); box-shadow: var(--shadow-lg); transform: translateX(102%); transition: transform .22s cubic-bezier(.2, .8, .2, 1); }
.drawer.open { transform: none; }
.dr-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--muted); }
.dr-head a, .link { color: var(--accent); cursor: pointer; text-decoration: none; }
.dr-head a:hover, .link:hover { text-decoration: underline; }
.title-input { font-size: 20px; font-weight: 600; background: transparent; border: 1px solid transparent; box-shadow: none; padding: 4px 8px; margin: 10px -8px 4px; width: calc(100% + 16px); }
.title-input:hover { border-color: var(--border); }
.actionbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0 16px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel-2); }
.actionbar.review { border-color: color-mix(in srgb, var(--review) 35%, var(--border)); background: color-mix(in srgb, var(--review) 6%, var(--panel)); }
.actionbar.live-bar { border-color: color-mix(in srgb, var(--running) 35%, var(--border)); background: color-mix(in srgb, var(--running) 6%, var(--panel)); }
.actionbar .hint { color: var(--muted); font-size: 13px; flex: 1 1 200px; }
.feedback { width: 100%; }
.props { display: grid; grid-template-columns: 84px 1fr; gap: 8px 12px; align-items: center; }
.props > label { font-size: 12.5px; color: var(--muted); }
.desc { min-height: 120px; }
.sub-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; cursor: pointer; border-radius: 6px; }
.sub-row:hover { background: var(--hover); }
.sub-row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run-row { display: flex; align-items: center; gap: 10px; padding: 7px 6px; font-size: 12.5px; border-bottom: 1px solid var(--border); cursor: pointer; flex-wrap: wrap; }
.run-row:hover { background: var(--hover); }
.timeline { display: flex; flex-direction: column; gap: 10px; }
.ev-sys { font-size: 12.5px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; padding-left: 2px; }
.time { margin-left: auto; font-size: 11.5px; color: var(--dim); white-space: nowrap; }
.ev-card { border: 1px solid var(--border); border-radius: 8px; background: var(--panel); padding: 10px 12px; }
.ev-card.agent { border-left: 2px solid var(--accent); }
.ev-card.lead { border-left: 2px solid var(--review); }
.ev-card.user { background: var(--panel-2); }
.ev-card .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12.5px; color: var(--muted); }
.ev-card .head b { color: var(--text); font-weight: 600; }
.composer { margin-top: 14px; }
.composer .row { justify-content: flex-end; margin-top: 6px; }

/* ---------- 新建弹窗 ---------- */
.modal-wrap { position: fixed; inset: 0; z-index: 30; display: none; place-items: start center; padding-top: 12vh; background: rgba(0, 0, 0, 0.3); }
.modal-wrap.open { display: grid; }
.modal { width: min(640px, calc(100vw - 32px)); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; box-shadow: var(--shadow-lg); }
.modal .title-input { font-size: 18px; margin-top: 4px; }
.modal-props { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.modal-props select, .modal-props input { width: auto; flex: 1 1 140px; }
.modal-props .check { flex: 1 1 200px; align-items: center; }
.modal-props .check input { flex: none; margin-top: 0; }
.modal-foot { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.modal-foot .hint { color: var(--muted); font-size: 12.5px; margin-right: auto; }
.modal-foot .hint.go { color: var(--accent); }

/* ---------- 提示 ---------- */
.toasts { position: fixed; right: 18px; bottom: 18px; z-index: 40; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { font-size: 13px; padding: 9px 14px; max-width: 360px; background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 8px; box-shadow: var(--shadow-lg); animation: toastIn .2s ease-out; }
.toast.ok { border-left-color: var(--completed); } .toast.err { border-left-color: var(--failed); } .toast.review { border-left-color: var(--review); }
@keyframes toastIn { from { opacity: 0; transform: translateY(6px); } }

/* ---------- 智能体工作室 ---------- */
.studio-side { width: 300px; padding: 12px; }
.side-head { display: flex; align-items: center; justify-content: space-between; margin: 16px 6px 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
.side-head:first-child { margin-top: 4px; }
.side-head button { padding: 2px 8px; font-size: 12px; box-shadow: none; }
.side-item { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; cursor: pointer; border: 1px solid transparent; }
.side-item:hover { background: var(--hover); }
.side-item.sel { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.side-item .meta { min-width: 0; flex: 1; }
.side-item .t { font-weight: 500; display: flex; gap: 6px; align-items: center; }
.side-item .s { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side-foot { margin: 20px 6px 4px; font-size: 12px; }
.model-chip { font-size: 11px; padding: 0 6px; height: 18px; display: inline-flex; align-items: center; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border); color: var(--muted); white-space: nowrap; font-weight: 400; }
.skill-icon { width: 20px; height: 20px; border-radius: 5px; display: inline-grid; place-items: center; background: color-mix(in srgb, var(--review) 14%, transparent); color: var(--review); font-size: 11px; flex-shrink: 0; }
.skill-icon.lg { width: 40px; height: 40px; font-size: 18px; border-radius: 10px; }
.studio-main { padding: 24px 32px 0; }
.studio-inner { max-width: 960px; }
.ed-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; flex-wrap: wrap; }
.avatar.lg { width: 40px; height: 40px; font-size: 16px; }

.ed-head .actions { margin-left: auto; display: flex; gap: 8px; }
.ed-section { border-top: 1px solid var(--border); padding: 18px 0; display: grid; grid-template-columns: 180px minmax(0, 1fr); gap: 24px; }

.ed-section > .lbl span { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; line-height: 1.5; }
.fields { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

.field .help { font-size: 12px; color: var(--dim); margin-top: 4px; }

.model-opt:hover { border-color: var(--border-strong); }

.model-opt .n { font-weight: 600; display: flex; gap: 6px; align-items: center; justify-content: space-between; }

.model-opt .p { font-size: 11.5px; color: var(--dim); margin-top: 6px; font-family: var(--mono); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 4px 0 4px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); font-size: 13px; cursor: pointer; }

.chip.new { border-style: dashed; border-color: color-mix(in srgb, var(--review) 50%, var(--border)); }
.chip .newtag { font-size: 10.5px; color: var(--review); }
.checks { display: flex; flex-direction: column; gap: 8px; }
.check { display: flex; align-items: flex-start; gap: 8px; font-size: 13px; cursor: pointer; }
.check input { width: auto; margin-top: 3px; accent-color: var(--accent); box-shadow: none; }
.check small { display: block; color: var(--muted); font-size: 12px; }
.prompt-area { min-height: 220px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; }
.savebar { position: sticky; bottom: 0; margin: 8px -32px 0; padding: 10px 32px; display: flex; align-items: center; gap: 8px; background: var(--panel); border-top: 1px solid var(--border); }
.savebar .hint { margin-right: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.savebar .hint::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--cancelled); }
.savebar.clean { display: none; }

/* ---------- AI 构建器 ---------- */
.modal-wrap.builder-wrap { padding-top: 0; place-items: center; }
.builder { width: min(1120px, calc(100vw - 32px)); height: min(760px, calc(100vh - 48px)); display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto minmax(0, 1fr); background: var(--panel); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; }
.b-head { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.b-head b { font-size: 14.5px; }
.b-chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
.b-msgs { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.ai-row { display: flex; gap: 8px; align-items: flex-start; max-width: 88%; }
.ai-mark { width: 24px; height: 24px; border-radius: 6px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); font-size: 12px; flex-shrink: 0; }
.bubble { padding: 9px 12px; border-radius: 10px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; }
.bubble.ai { background: var(--panel-2); border: 1px solid var(--border); border-top-left-radius: 3px; }
.bubble.me { background: var(--accent); color: var(--on-accent); align-self: flex-end; max-width: 80%; border-top-right-radius: 3px; }
.bubble.typing { color: var(--muted); }
.bubble.typing::after { content: "…"; animation: pulse 1s infinite; }
.suggests { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 18px 12px; }
.suggests button { font-size: 12.5px; border-radius: 999px; box-shadow: none; }
.b-input { border-top: 1px solid var(--border); padding: 12px; display: flex; gap: 8px; align-items: flex-end; }
.b-input textarea { min-height: 44px; max-height: 160px; resize: none; }
.b-draft { overflow-y: auto; padding: 16px; background: var(--bg); display: flex; flex-direction: column; gap: 10px; min-height: 0; }
.b-draft .card { margin: 0; padding: 12px; }
.b-draft .ttl { font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.b-foot { margin-top: auto; display: flex; gap: 8px; align-items: center; padding-top: 6px; }
.b-foot .hint { margin-right: auto; font-size: 12px; color: var(--muted); }
.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { background: var(--accent-soft); border-color: var(--accent); } }
@media (max-width: 900px) {
  .studio-side { width: auto; }
  .studio-main { padding: 16px 16px 0; }
  .ed-section { grid-template-columns: 1fr; gap: 10px; }
  .savebar { margin: 8px -16px 0; padding: 10px 16px; }
  .builder { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) minmax(0, 40%); height: calc(100vh - 24px); }
  .b-chat { border-right: none; border-bottom: 1px solid var(--border); }
}

/* ---------- 生命周期 ---------- */
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
.seg button { border: none; border-radius: 0; box-shadow: none; padding: 5px 12px; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--panel-2); color: var(--text); font-weight: 500; }
.steps { display: flex; gap: 3px; align-items: center; margin-top: 8px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--border); }
.steps i.pass { background: var(--completed); }
.steps i.active { background: var(--running); animation: pulse 1.4s ease-in-out infinite; }
.steps i.fail { background: var(--failed); }
.steps i.cancelled { background: var(--cancelled); }
.steps i.blocked { background: var(--cancelled); animation: pulse 1.4s ease-in-out infinite; }
.cell.blocked .st { color: var(--cancelled); } .cell.blocked .st::before { background: var(--cancelled); border-color: var(--cancelled); }
.steps-label { font-size: 11.5px; color: var(--muted); margin-top: 4px; display: flex; gap: 6px; }
.steps-label b { color: var(--running); font-weight: 500; }
.lc-wrap { flex: 1; min-height: 0; overflow: auto; padding: 16px; }
.lc-table { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; font-size: 13px; }
.lc-table th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted); padding: 9px 12px; background: var(--panel-2); border-bottom: 1px solid var(--border); white-space: nowrap; }
.lc-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.lc-table tr:last-child td { border-bottom: none; }
.lc-table tbody tr { cursor: pointer; }
.lc-table tbody tr:hover td { background: var(--hover); }
.lc-table tr.group td { background: var(--panel-2); color: var(--muted); font-size: 12px; font-weight: 600; cursor: default; padding: 7px 12px; }
.lc-title { font-weight: 500; max-width: 280px; }
.lc-title .ikey { margin-right: 6px; }
.cell { display: flex; flex-direction: column; gap: 2px; min-width: 96px; }
.cell .st { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 500; }
.cell .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--border-strong); flex-shrink: 0; }
.cell.pass .st { color: var(--completed); } .cell.pass .st::before { background: var(--completed); border-color: var(--completed); }
.cell.active .st { color: var(--running); } .cell.active .st::before { background: var(--running); border-color: var(--running); animation: pulse 1.4s ease-in-out infinite; }
.cell.fail .st { color: var(--failed); } .cell.fail .st::before { background: var(--failed); border-color: var(--failed); }
.cell.cancelled .st { color: var(--cancelled); } .cell.cancelled .st::before { background: var(--cancelled); border-color: var(--cancelled); }
.cell.pending .st { color: var(--dim); font-weight: 400; }
.cell .note { font-size: 11.5px; color: var(--muted); max-width: 180px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cycle-tag { font-size: 11.5px; padding: 0 6px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--border); white-space: nowrap; }
.cycle-tag.warn { color: var(--cancelled); border-color: color-mix(in srgb, var(--cancelled) 40%, var(--border)); }
.lc-cycles { display: flex; flex-direction: column; gap: 10px; }
.lc-cycle { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.lc-cycle .hd { font-size: 12px; color: var(--muted); margin-bottom: 8px; display: flex; gap: 8px; align-items: center; }
.lc-cycle .grid5 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
.lc-cycle .cell { min-width: 0; }
.lc-cycle .cell .note { white-space: normal; max-width: none; }
@media (max-width: 900px) { .lc-cycle .grid5 { grid-template-columns: 1fr 1fr; } }

/* ---------- 运行中心 ---------- */
.center-page { padding: 20px 24px 32px; }
.center-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.center-head h2 { margin: 0; font-size: 18px; font-weight: 600; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 20px; }
.tile { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; box-shadow: var(--shadow-sm); cursor: default; }
.tile .k { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.tile .v { font-size: 26px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .d { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile.running .v { color: var(--running); } .tile.review .v { color: var(--review); } .tile.bad .v { color: var(--failed); }
.center-block { margin-bottom: 20px; }
.center-block > .bh { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 13.5px; font-weight: 600; }
.center-block > .bh .muted { font-weight: 400; font-size: 12.5px; }
.center-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; }
.panel-box { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.agent-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
.agent-row:last-child { border-bottom: none; }

.agent-row .t { font-weight: 500; display: flex; gap: 6px; align-items: center; }

.busy-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--border-strong); flex-shrink: 0; }

.feed-row { display: flex; gap: 10px; padding: 9px 14px; border-bottom: 1px solid var(--border); font-size: 13px; align-items: baseline; cursor: pointer; }
.feed-row:hover { background: var(--hover); }
.feed-row:last-child { border-bottom: none; }
.feed-row .ikey { flex-shrink: 0; }
.feed-row .b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-row.fail .b { color: var(--failed); }
@media (max-width: 900px) { .center-grid { grid-template-columns: 1fr; } .center-page { padding: 16px; } .lc-table { min-width: 900px; } .center-block .lc-scroll { overflow-x: auto; } }

/* ---------- 项目 / 设置 ---------- */
.proj-switch { position: relative; }
.proj-btn { display: flex; align-items: center; gap: 8px; padding: 3px 10px 3px 3px; box-shadow: none; }
.proj-btn .n { font-weight: 600; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.proj-btn .caret { color: var(--muted); font-size: 10px; }
.pbadge { --hue: 210; min-width: 26px; height: 24px; padding: 0 4px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 10px; font-weight: 700; color: #fff; background: hsl(var(--hue) 50% 48%); flex-shrink: 0; }
.ed-head .pbadge { min-width: 40px; height: 40px; font-size: 13px; border-radius: 10px; }
.menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 25; min-width: 320px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-lg); padding: 6px; display: none; }
.menu.open { display: block; }
.menu .mi { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.menu .mi:hover { background: var(--hover); }
.menu .mi .meta { flex: 1; min-width: 0; }
.menu .mi .s { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 3px; white-space: nowrap; overflow: hidden; }
.menu .tick { margin-left: auto; color: var(--accent); }
.menu .sep { height: 1px; background: var(--border); margin: 6px 0; }
.menu .mh { font-size: 11.5px; color: var(--muted); padding: 4px 8px; }
.projbar { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); flex-wrap: wrap; }
.projbar button { padding: 3px 10px; font-size: 12px; }
.ghi { display: inline-flex; }
.ghi svg { width: 12px; height: 12px; fill: currentColor; }
.gh { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.gh.closed { color: var(--review); }
.callout { border: 1px solid var(--border); background: var(--panel-2); border-radius: 8px; padding: 10px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.callout.warn { border-color: color-mix(in srgb, var(--cancelled) 40%, var(--border)); background: color-mix(in srgb, var(--cancelled) 7%, var(--panel)); }
.acct { display: flex; align-items: center; gap: 12px; }
.acct .avatar { width: 32px; height: 32px; font-size: 13px; }
.map-table { border-collapse: collapse; font-size: 13px; }
.map-table td, .map-table th { padding: 7px 12px 7px 0; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; }
.map-table th { font-weight: 500; color: var(--muted); font-size: 12px; white-space: nowrap; }
.log-row { display: flex; gap: 10px; font-size: 12.5px; padding: 6px 0; border-bottom: 1px dashed var(--border); }
.log-row.warn { color: var(--cancelled); }
.radio-row { display: flex; gap: 8px; flex-wrap: wrap; }
.radio-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; flex: 1 1 240px; background: var(--panel); }
.radio-card.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.radio-card b { display: block; font-size: 13.5px; }
.radio-card > span { font-size: 12px; color: var(--muted); }
.ok-text { color: var(--completed); } .err-text { color: var(--failed); }
.model-opt.warn .p { color: var(--failed); }

/* ---------- 首页 / 管家 ---------- */
.home { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(340px, 1fr); gap: 0; flex: 1; min-height: 0; }
.home-chat { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); background: var(--panel); }
.home-chat-head { display: flex; align-items: center; gap: 8px; padding: 12px 18px; border-bottom: 1px solid var(--border); }
.home-chat-head .muted { font-size: 12.5px; }
.home-side { min-height: 0; overflow: auto; padding: 18px 20px; }
.ai-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; flex: 1; }
.home .ai-row { max-width: 92%; }
.pcard { border: 1px solid var(--border); border-radius: 10px; background: var(--panel); padding: 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-sm); }
.pcard.done { background: var(--panel-2); box-shadow: none; }
.pc-head { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.pc-row { display: flex; gap: 6px; align-items: center; }
.pc-row input[type=checkbox] { width: auto; accent-color: var(--accent); box-shadow: none; }
.pc-row .pc-title { flex: 1; min-width: 120px; }
.pc-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.proj-row { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; align-items: flex-start; }
.proj-row:hover { background: var(--hover); }
.proj-row:last-child { border-bottom: none; }
.proj-row .meta { flex: 1; min-width: 0; }
.proj-row .t { font-weight: 600; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.proj-row .s { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.phase-dots { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 6px; }
.feed-row button { padding: 2px 10px; font-size: 12px; }
/* 运行中心队列 */
.qboard { display: grid; grid-template-columns: repeat(5, minmax(200px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 4px; }
.qcol { min-height: 320px; }
.qdot { width: 8px; height: 8px; border-radius: 50%; background: var(--running); }
.q-understand { background: #94a3b8; } .q-plan { background: #a78bfa; } .q-do { background: var(--running); } .q-test { background: var(--cancelled); } .q-review { background: var(--review); }
.qcol .icard { cursor: pointer; }
@media (max-width: 900px) { .home { grid-template-columns: 1fr; } .home-chat { min-height: 70vh; border-right: none; } }

/* ---------- 测试 ---------- */
.tq { display: grid; grid-template-columns: minmax(240px, 1fr) minmax(320px, 1.4fr) minmax(240px, 1fr); gap: 12px; min-height: 420px; }
.tq .bcol { min-height: 420px; }
.lane { border: 1px dashed var(--border-strong); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.lane-head { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.lane .bcol-empty { padding: 10px 0; border: none; }
.qcard { cursor: pointer; }
.qwait { font-size: 12px; color: var(--cancelled); margin-top: 6px; }
.qlive { display: flex; gap: 10px; margin-top: 8px; align-items: center; }
.qthumb { width: 96px; height: 60px; object-fit: cover; border: 1px solid var(--border); border-radius: 4px; flex-shrink: 0; }
.cov-list { display: flex; flex-direction: column; gap: 12px; }
.cov { padding: 12px 14px; }
.cov-head { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 6px; flex-wrap: wrap; }
.cov-note { font-size: 12px; color: var(--cancelled); margin-bottom: 4px; }
.covbar { width: 120px; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; display: inline-block; }
.covbar i { display: block; height: 100%; background: var(--completed); }
.score { display: inline-block; font-weight: 600; font-size: 12px; padding: 0 7px; border-radius: 999px; }
.score.hi { color: var(--completed); background: color-mix(in srgb, var(--completed) 12%, transparent); }
.score.mid { color: var(--cancelled); background: color-mix(in srgb, var(--cancelled) 12%, transparent); }
.score.lo { color: var(--failed); background: color-mix(in srgb, var(--failed) 12%, transparent); }
.case { border: 1px solid var(--border); border-radius: 8px; margin-bottom: 8px; background: var(--panel); }
.case > summary { display: flex; align-items: center; gap: 8px; padding: 9px 12px; cursor: pointer; list-style: none; }
.case > summary::-webkit-details-marker { display: none; }
.case .ctitle { flex: 1; min-width: 0; font-weight: 500; }
.cst { width: 16px; text-align: center; flex-shrink: 0; color: var(--dim); }

.case.running > summary .cst { color: var(--running); animation: pulse 1.4s infinite; }
.case.failed { border-color: color-mix(in srgb, var(--failed) 40%, var(--border)); }
.steps-list { border-top: 1px solid var(--border); padding: 6px 12px 10px; }
.step { padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
.step:last-child { border-bottom: none; }
.step.skipped { opacity: .5; }
.sl { display: flex; gap: 8px; align-items: flex-start; }
.scmd { display: block; font-size: 11.5px; color: var(--muted); background: var(--code); border-radius: 4px; padding: 2px 6px; margin-top: 3px; overflow-x: auto; white-space: nowrap; }
.sshot { width: 150px; height: 94px; object-fit: cover; border: 1px solid var(--border); border-radius: 4px; cursor: zoom-in; flex-shrink: 0; }
@media (max-width: 900px) { .tq { grid-template-columns: 1fr; } }

/* ---------- 自动化 ---------- */
.rule { display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
.rule:last-child { border-bottom: none; }
.rule .check b { display: block; font-weight: 600; }
.rule-body { font-size: 12.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; padding-left: 24px; flex-wrap: wrap; }
.rule-body input { width: 70px; }
.sla { display: flex; flex-wrap: wrap; gap: 8px 12px; }
.sla label { display: flex; align-items: center; gap: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-width: 900px) {
  html, body { height: auto; }
  body { display: block; }
  header { gap: 8px 16px; padding: 8px 16px; height: auto; }
  nav { overflow-x: auto; max-width: 100%; }
  #connText { display: none; }
  main { display: block; }
  .view.active { display: block; }
  .col { width: auto; overflow: visible; border: none; border-bottom: 1px solid var(--border); padding: 12px 16px; }
  .node .snippet { flex-basis: 100%; }
  .board-wrap { padding: 0; }
  .bcol { flex-basis: 82vw; max-height: 72vh; }
  .toolbar #issueSearch { width: 100%; }
}

/* ================= 视觉精修层：侧边栏布局 + 组件细节 ================= */
body { flex-direction: row; }
.sidebar { width: 236px; flex-shrink: 0; display: flex; flex-direction: column; gap: 14px; min-height: 0; padding: 16px 10px 10px; background: var(--side); border-right: 1px solid var(--border); position: relative; z-index: 15; }
.sb-top { display: flex; flex-direction: column; gap: 14px; }
.logo { padding: 0 8px; align-items: center; gap: 10px; }
.logo-mark { width: 24px; height: 24px; border-radius: 8px; flex-shrink: 0; position: relative; background: linear-gradient(140deg, var(--accent), color-mix(in srgb, var(--accent) 50%, #06b6d4)); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .3), 0 1px 3px color-mix(in srgb, var(--accent) 40%, transparent); }
.logo-mark::before, .logo-mark::after { content: ""; position: absolute; border-radius: 50%; background: #fff; }
.logo-mark::before { width: 6px; height: 6px; left: 5px; top: 9px; }
.logo-mark::after { width: 4px; height: 4px; right: 5px; top: 6px; box-shadow: 0 8px 0 #fff; opacity: .85; }
.logo h1 { font-size: 15px; font-weight: 650; letter-spacing: -.02em; }
.proj-btn { width: 100%; padding: 6px 8px; border-radius: 10px; }
.proj-btn .n { flex: 1; text-align: left; max-width: none; }
.sidebar nav { flex: 1; min-height: 0; overflow-y: auto; flex-direction: column; gap: 1px; }
.nav-group { font-size: 11px; font-weight: 600; color: var(--dim); padding: 14px 10px 5px; letter-spacing: .08em; }
.nav-group:first-child { padding-top: 0; }
.sidebar nav button, .sb-btn { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 7px 10px; border: none; border-radius: 8px; background: none; box-shadow: none; color: var(--muted); font-size: 13.5px; font-weight: 500; }
.sidebar nav button:hover, .sb-btn:hover { background: var(--hover); color: var(--text); }
.sidebar svg { width: 16px; height: 16px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; opacity: .8; }
.sidebar nav button.active { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--border), var(--shadow-sm); }
.sidebar nav button.active svg { color: var(--accent); opacity: 1; }
.sb-foot { display: flex; flex-direction: column; gap: 4px; padding-top: 10px; border-top: 1px solid var(--border); }
.sb-btn .count { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; display: grid; place-items: center; background: var(--accent); color: #fff; font-size: 11px; font-weight: 600; }
.sb-btn .count:empty { display: none; }
.conn { margin-left: 0; padding: 4px 10px; }
.conn #tokenBtn { margin-left: auto; padding: 1px 8px; font-size: 12px; box-shadow: none; }
main { min-width: 0; }
.view { min-width: 0; }
button { white-space: nowrap; }

/* 页面骨架 */
.center-page, .studio-main { padding: 28px 36px 40px; }
.center-head { margin-bottom: 22px; gap: 12px; align-items: center; flex-wrap: wrap; }

.center-head .muted { font-size: 13px; }
.center-block { margin-bottom: 26px; }
.center-block > .bh { font-size: 14px; margin-bottom: 10px; }
.center-grid { gap: 24px; }
.toolbar { padding: 14px 24px; gap: 10px; background: transparent; }
.board { padding: 20px 24px; gap: 14px; }

/* 控件 */
button { border-radius: 8px; }
button.primary { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), 0 1px 2px rgba(0, 0, 0, .14); }
select, textarea, input { border-radius: 8px; padding: 7px 10px; }
.seg { border: none; background: var(--panel-2); padding: 3px; gap: 2px; border-radius: 10px; overflow: visible; }
.seg button, .seg button + button { border: none; border-radius: 7px; padding: 4px 12px; background: none; }
.seg button.on { background: var(--panel); box-shadow: var(--shadow-sm), 0 0 0 1px var(--border); }
.proto-flag { background: none; color: var(--dim); border: 1px dashed var(--border-strong); font-weight: 400; }
.badge { height: 21px; }

/* 卡片与面板 */
.tiles { gap: 14px; margin-bottom: 28px; }
.tile { border-radius: 14px; padding: 18px 20px; box-shadow: none; }
.tile .k { font-weight: 500; }
.tile .v { font-size: 30px; font-weight: 650; letter-spacing: -.03em; line-height: 1.1; margin-top: 8px; }

.card, .panel-box, .pcard, .lc-table, .case { border-radius: 12px; }

.bcol-head { padding: 12px 14px 8px; }
.bcol-body { padding: 4px 10px 10px; gap: 8px; }

.icard:hover { box-shadow: 0 6px 18px rgba(0, 0, 0, .08); transform: translateY(-1px); }
.icard.running { box-shadow: inset 2px 0 0 var(--running), 0 1px 1px rgba(0, 0, 0, .03); }
.feed-row, .agent-row, .proj-row { padding: 11px 16px; }
.ed-section { padding: 24px 0; gap: 32px; grid-template-columns: 200px minmax(0, 1fr); }
.drawer { width: min(700px, 100vw); padding: 20px 28px 56px; }
.menu { border-radius: 12px; }
.modal { border-radius: 14px; }
.toast { border-radius: 10px; }

/* 首页 */
.home { grid-template-columns: minmax(0, 1.35fr) minmax(360px, 1fr); }
.home-chat { background: var(--bg); }
.home-chat-head { padding: 18px 32px 10px; border-bottom: none; }

.home .suggests { padding: 0 32px 12px; }
.home .b-input { border-top: none; padding: 0 32px 26px; align-items: stretch; }
.home .b-input textarea { border-radius: 14px; padding: 12px 14px; min-height: 52px; box-shadow: var(--shadow-sm); }
.home .b-input button { border-radius: 12px; padding: 0 18px; }
.bubble { border-radius: 14px; padding: 10px 14px; }

.ai-mark { border-radius: 8px; }
.hero { padding: 10vh 0 18px; }
.hero h1 { margin: 0 0 10px; font-size: 30px; font-weight: 650; letter-spacing: -.03em; }
.hero p { margin: 0; color: var(--muted); font-size: 14.5px; line-height: 1.7; max-width: 560px; }
.home-side { padding: 24px 24px 32px; background: var(--side); }
.suggests button { background: var(--panel); padding: 6px 14px; }

/* 通知面板 */
.notif-panel { position: fixed; left: 246px; bottom: 14px; top: auto; width: 400px; max-height: 72vh; overflow: auto; padding: 0; }
.np-head { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--panel); }
.np-item { display: flex; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border); cursor: pointer; }
.np-item:hover { background: var(--hover); }
.np-item:last-child { border-bottom: none; }
.np-dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex-shrink: 0; background: var(--border-strong); }
.np-item.unread .np-dot.k-confirm { background: var(--cancelled); } .np-item.unread .np-dot.k-review { background: var(--review); }
.np-item.unread .np-dot.k-guard, .np-item.unread .np-dot.k-budget { background: var(--failed); } .np-item.unread .np-dot.k-hotfix { background: var(--completed); }
.np-title { font-weight: 600; } .np-item:not(.unread) .np-title { font-weight: 500; color: var(--muted); }
.np-body { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.np-meta { font-size: 11.5px; color: var(--dim); margin-top: 4px; }

/* 验收材料 */
.accept { border: 1px solid color-mix(in srgb, var(--review) 30%, var(--border)); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 10px; background: color-mix(in srgb, var(--review) 3%, var(--panel)); }
.ac-title { font-weight: 600; display: flex; gap: 8px; align-items: baseline; } .ac-title .muted { font-weight: 400; font-size: 12.5px; }
.ac-facts { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.ac-fact { background: var(--panel); padding: 9px 12px; } .ac-fact .k { font-size: 11.5px; color: var(--muted); } .ac-fact .v { font-weight: 600; font-size: 13px; margin-top: 2px; }
.ac-sub { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 4px; }
.ac-crit { display: flex; gap: 8px; padding: 4px 0; font-size: 13px; align-items: baseline; }
.ac-shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ac-shots img { width: 100%; border: 1px solid var(--border); border-radius: 6px; cursor: zoom-in; display: block; }
.ac-deliver { font-size: 13px; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; max-height: 180px; overflow: auto; }
.props > label.cost-row { align-self: center; }

/* 项目知识 */
.kn-row { display: flex; gap: 10px; align-items: flex-start; padding: 11px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
.kn-row:last-child { border-bottom: none; }
.kn-row input { width: auto; margin-top: 3px; accent-color: var(--accent); box-shadow: none; }
.tag.kn-教训 { color: var(--cancelled); } .tag.kn-架构 { color: var(--running); }

@media (max-width: 900px) {
  body { display: block; }
  .sidebar { width: auto; flex-direction: row; align-items: center; gap: 8px; padding: 8px 12px; border-right: none; border-bottom: 1px solid var(--border); }
  .sb-top { flex-direction: row; align-items: center; gap: 8px; }
  .logo h1, .nav-group, .conn, .proj-btn .n { display: none; }
  .logo { padding: 0; }
  .proj-btn { width: auto; }
  .sidebar nav { flex-direction: row; overflow-x: auto; overflow-y: hidden; }
  .sidebar nav button { width: auto; white-space: nowrap; }
  .sb-foot { flex-direction: row; border-top: none; padding-top: 0; }
  .sb-btn { width: auto; font-size: 0; gap: 0; }
  .center-page, .studio-main { padding: 16px; }
  .home { grid-template-columns: 1fr; }
  .home-chat { min-height: 72vh; border-right: none; border-bottom: 1px solid var(--border); }
  .hero { padding-top: 5vh; } .hero h1 { font-size: 24px; }
  .home-side { padding: 16px; }
  .tq, .qboard { grid-template-columns: 1fr; }
  .home .b-msgs, .home .suggests, .home .b-input, .home-chat-head { padding-left: 16px; padding-right: 16px; }
  .notif-panel { left: 12px; right: 12px; width: auto; top: 60px; bottom: auto; }
  .ac-facts { grid-template-columns: 1fr 1fr; }
  .ed-section { grid-template-columns: 1fr; gap: 10px; }
}
</style>
</head>

<script>
const $ = (s) => document.querySelector(s);
/** 安全构建 DOM：字符串子节点一律作为文本 */
function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else el.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
/** 替换子节点：与 h() 一样深度展开数组、忽略 null/false，字符串作为文本 */
function fill(el, ...children) {
  el.replaceChildren(...children.flat(Infinity).filter((c) => c != null && c !== false).map((c) => (c instanceof Node ? c : String(c))));
  return el;
}
const STATUS = { pending: "等待", running: "运行中", completed: "完成", failed: "失败", cancelled: "已取消" };
/** 键值网格：每个单元格都包一层元素，避免文本节点合并 */
const kv = (pairs, attrs = {}) => h("div", { class: "kv", ...attrs }, pairs.map((x) => (x instanceof Node ? x : h("span", {}, x))));
const badge = (s) => h("span", { class: `badge s-${s}` }, STATUS[s] ?? s);
const ago = (iso) => {
  const s = (Date.now() - new Date(iso)) / 1000;
  return s < 60 ? `${Math.floor(s)} 秒前` : s < 3600 ? `${Math.floor(s / 60)} 分钟前` : s < 86400 ? `${Math.floor(s / 3600)} 小时前` : new Date(iso).toLocaleString();
};
const dur = (t) => {
  const s = Math.round((new Date(t.updatedAt) - new Date(t.createdAt)) / 1000);
  return s < 60 ? `${s}s` : `${Math.floor(s / 60)}m${s % 60}s`;
};
const short = (s, n = 80) => (s.length > n ? s.slice(0, n) + "…" : s);
const fmtTok = (n) => (n >= 1000 ? (n / 1000).toFixed(1) + "k" : String(n));

// ---------- API ----------
let token = "";
try { token = localStorage.getItem("hubToken") || ""; } catch {}
async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "content-type": "application/json", ...(token ? { authorization: `Bearer ${token}` } : {}) },
  });
  if (res.status === 401) { askToken(); throw new Error("unauthorized"); }
  if (res.status === 204) return null;
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;

let es, timers = {};
const debounce = (k, fn, ms = 250) => { clearTimeout(timers[k]); timers[k] = setTimeout(fn, ms); };
function connect() {
  es?.close();
  es = new EventSource("/events" + (token ? "?token=" + encodeURIComponent(token) : ""));
  es.onopen = () => { $("#dot").classList.add("on"); $("#connText").textContent = "已连接"; };
  es.onerror = () => { $("#dot").classList.remove("on"); $("#connText").textContent = "重新连接中…"; };
  es.addEventListener("task", (ev) => {
    const { task } = JSON.parse(ev.data);
    if (!task.parentId) debounce("roots", loadRoots);
    if (task.rootId === state.selRoot) debounce("tree", loadTree);
    if (task.id === state.selNode) debounce("detail", loadDetail, 400);
    if (viewActive("center")) debounce("center", renderCenter, 500);
  });
  es.addEventListener("bus", () => { if ($("#view-bus").classList.contains("active")) debounce("bus", loadTopics); });
  // 工作项、测试、自动化等状态变化：重新拉取快照；关键事件给出提示
  es.addEventListener("work", (ev) => {
    const e = JSON.parse(ev.data);
    if (e.kind === "run_finished") {
      if (e.status === "completed") toast(`✓ ${e.key} 已交付`, "review");
      else if (e.status === "failed") toast(`✕ ${e.key} 运行失败`, "err");
      else if (e.status === "cancelled") toast(`■ ${e.key} 已停止`);
    }
    if (e.kind === "phase" && e.result === "fail") toast(`${e.key} ${e.phase === "test" ? "测试未通过，回到执行修复" : "评审未通过，开始新一轮"}`, "err");
    debounce("state", refreshState, 250);
  });
  es.addEventListener("task", (ev) => { const { task } = JSON.parse(ev.data); if (task.issueId != null || task.source === "qa") debounce("state", refreshState, 400); });
}

  const users = isNew ? [] : studio.usage(st.sel.id);
  const save = async () => {
    try {
      const s = await studio.saveSkill(d, st.sel.id);
      if (isNew && st.attachTo) {
        const a = clone(studio.agent(st.attachTo));
        if (a && !a.skills.includes(s.id)) { a.skills.push(s.id); await studio.saveAgent(a, a.name); }
        toast(`已创建技能「${s.name}」并添加到 ${st.attachTo}`, "ok");
        st.sel = { kind: "agent", id: st.attachTo };
        st.attachTo = null;
      } else {
        toast(isNew ? `已创建技能「${s.name}」` : `已保存「${s.name}」`, "ok");
        st.sel = { kind: "skill", id: s.id };
      }
      loadDraft();
      renderStudio();
    } catch (e) { fail(e); }
  };
  const cancel = () => {
    if (isNew) { st.draft = null; const back = st.attachTo; st.attachTo = null; st.sel = back ? { kind: "agent", id: back } : { kind: "agent", id: studio.agents()[0]?.name }; loadDraft(); renderStudio(); }
    else { loadDraft(); renderStudio(); }
  };
  return [
    h("div", { class: "ed-head" },
      h("span", { class: "skill-icon lg" }, "✦"),
      h("div", {}, h("h2", {}, isNew ? "新建技能" : studio.skill(st.sel.id)?.name),
        h("div", { class: "sub" }, isNew ? (st.attachTo ? `创建后会添加到 ${st.attachTo}` : "可复用的专业指令，可挂到任意智能体上") : `${users.length} 个智能体在用 · 创建者 ${d.createdBy ?? ME}`)),
      !isNew ? h("div", { class: "actions" }, h("button", { class: "danger", onclick: () => {
        if (!confirm(`删除技能「${d.name}」？${users.length ? `\n${users.join("、")} 将不再使用它。` : ""}`)) return;
        studio.deleteSkill(st.sel.id).then(() => {
          st.sel = { kind: "agent", id: studio.agents()[0]?.name };
          loadDraft(); renderStudio();
        }).catch(fail);
      } }, "删除")) : null),
    section("基本信息", "「何时使用」决定智能体在什么情况下加载这个技能，写得越具体越准。",
      field("名称", textIn(d, "name", { placeholder: "如 周报模板" })),
      field("标识", textIn(d, "id", { placeholder: "如 weekly-report" }), "英文标识，智能体通过它加载技能"),
      field("何时使用", textIn(d, "description", { placeholder: "如 生成周报、月报等定期汇报时使用" }))),
    section("指令", "加载技能后智能体会读到的完整内容，支持 Markdown。可以写步骤、模板、检查清单、示例。",
      textIn(d, "instructions", { multiline: true, class: "prompt-area", placeholder: "## 步骤\n\n1. …\n2. …" })),
    !isNew ? section("使用者", "在智能体的「技能」里添加或移除。",
      users.length ? h("div", { class: "chips" }, users.map((n) => h("span", { class: "chip", onclick: () => selectStudio("agent", n) }, avatar(n), n, h("span", { style: "width:4px" }))))
        : h("div", { class: "muted", style: "font-size:13px" }, "还没有智能体使用这个技能")) : null,
    savebar(isNew ? "新技能尚未创建" : "有未保存的修改", save, cancel),
  ];
}

function uniqueName(base) { let n = base, i = 2; while (studio.agent(n)) n = `${base}-${i++}`; return n; }
function uniqueSkillId(base) { let n = base, i = 2; while (studio.skill(n) || bd.newSkills.some((s) => s.id === n)) n = `${base}-${i++}`; return n; }
const bSkill = (id) => bd.newSkills.find((s) => s.id === id) ?? studio.skill(id);
const skillNames = (ids) => ids.map((id) => `「${bSkill(id)?.name ?? id}」`).join("、") || "暂无";

function mockBuilderReply(text) {
  const d = bd.draft;
  const ch = (k) => bd.changed.add(k);
  if (bd.turn++ === 0 && bd.mode === "create") {
    const t = TEMPLATES.find((x) => x.re.test(text)) ?? GENERIC;
    d.name = uniqueName(t.name);
    d.description = t.description || text.slice(0, 40);
    d.model = t.model;
    d.effort = t.effort;
    d.serverTools = [...(t.serverTools ?? [])];
    d.system = `你是${d.description ? "负责「" + d.description + "」的智能体" : "一个智能体"}。\n\n## 用户的要求\n${text}\n\n## 工作方式\n- 先确认输入是否完整，缺信息时明确指出\n- 按相关技能的指令完成工作\n- 输出结构清晰，结论先行`;
    bd.newSkills = t.newSkills.map((s) => ({ ...s, id: uniqueSkillId(s.id), createdBy: "AI 助手" }));
    d.skills = [...t.reuse.filter((id) => studio.skill(id)), ...bd.newSkills.map((s) => s.id)];
    ["name", "model", "skills", "system", "tools"].forEach(ch);
    return `好的，我在右侧起草了「${d.name}」：\n\n· 职责：${d.description}\n· 模型：${modelShort(d.model)}（${t.why}）\n· 技能：${skillNames(d.skills)}${bd.newSkills.length ? "（标「新」的会随智能体一起创建）" : ""}\n\n还想确认两点：\n1. ${t.ask[0]}\n2. ${t.ask[1]}\n\n直接回复就行，也可以说「换成 Haiku」「加一个技能：xxx」「名字叫 xxx」。`;
  }
  const notes = [];
  const lower = text.toLowerCase();
  const m = MODELS.find((x) => lower.includes(x.id.split("-")[1]));
  if (m && m.id !== d.model) { d.model = m.id; ch("model"); notes.push(`模型换成了 ${m.name}：${m.desc}。`); }
  const nm = /(?:名字|名称|叫做?|改名为?)\s*[「"“']?([a-zA-Z0-9_-]{2,40})/.exec(text);
  if (nm) { d.name = nm[1]; ch("name"); notes.push(`名称改为 ${nm[1]}。`); }
  const sk = /(?:加|添加|新增|创建|新建)(?:一个|个)?技能[：:\s]*(.+)/.exec(text);
  if (sk) {
    const name = sk[1].split(/[，。,.\n]/)[0].trim().slice(0, 20) || "新技能";
    const s = { id: uniqueSkillId(studio.nextSkillId()), name, description: `需要「${name}」相关能力时使用`, createdBy: "AI 助手",
      instructions: `## ${name}\n\n（根据对话起草，可在「技能」里继续完善）\n\n1. 明确输入与期望输出\n2. 按步骤执行，每步自检\n3. 输出前对照验收标准检查` };
    bd.newSkills.push(s);
    d.skills.push(s.id);
    ch("skills");
    notes.push(`新建了技能「${name}」并挂到这个智能体上，指令先起草了一版，之后可以在「技能」里细改。`);
  } else {
    const reuse = studio.skills().find((s) => text.includes(s.name) && !d.skills.includes(s.id));
    if (reuse) { d.skills.push(reuse.id); ch("skills"); notes.push(`挂上了已有技能「${reuse.name}」。`); }
  }
  if (/去掉|移除|删掉/.test(text)) {
    const rm = d.skills.find((id) => text.includes(bSkill(id)?.name ?? "\u0000"));
    if (rm) { toggleIn(d.skills, rm, false); ch("skills"); notes.push(`移除了技能「${bSkill(rm).name}」。`); }
  }
  if (/联网|搜索|上网|查资料/.test(text) && !d.serverTools.includes("web_search")) { toggleIn(d.serverTools, "web_search", true); toggleIn(d.serverTools, "web_fetch", true); ch("tools"); notes.push("开启了联网搜索和网页抓取。"); }
  if (/委派|调用其他|分派|找其他/.test(text) && d.delegation === "none") { d.delegation = "any"; ch("tools"); notes.push("允许它把子任务委派给其他智能体。"); }
  if (/深入|仔细|更强|多想/.test(text)) { d.effort = "high"; ch("model"); notes.push("思考强度调到「高」。"); }
  if (/更快|省钱|便宜|成本/.test(text) && !m) { d.model = "claude-haiku-5-5"; d.effort = "low"; ch("model"); notes.push("为了更快更省，换成 Haiku 5.5，思考强度「低」。"); }
  if (!notes.length) {
    d.system = (d.system ? d.system + "\n\n" : "") + `## 补充要求\n${text}`;
    ch("system");
    notes.push("已把这条要求写进系统提示词。");
  }
  return `${notes.join("\n")}\n\n还有要调整的吗？满意的话点右下角「${bd.mode === "edit" ? "应用修改" : "创建智能体"}」。`;
}

async function bSend(text) {
  text = (text ?? "").trim();
  if (!text || bd.busy) return;
  bd.msgs.push({ role: "me", text });
  bd.busy = true;
  bd.input = "";
  const input = $("#bInput");
  if (input) input.value = "";
  renderBMsgs();
  let reply;
  try {
    const r = await rpc("assistant.builder", { mode: bd.mode, draft: bd.draft, history: bd.msgs.slice(0, -1).map((m) => ({ role: m.role, text: m.text })), text });
    if (r?.fallback) reply = mockBuilderReply(text);
    else {
      reply = r.reply;
      Object.assign(bd.draft, r.draft);
      for (const sk of r.newSkills ?? []) if (!bd.newSkills.some((x) => x.id === sk.id)) bd.newSkills.push(sk);
      for (const k of r.changed ?? []) bd.changed.add(k);
      bd.turn++;
    }
  } catch (e) { reply = `出错了：${e.message}`; }
  if (!bd.open) return;
  bd.msgs.push({ role: "ai", text: reply });
  bd.busy = false;
  renderBMsgs();
  renderBDraft();
}

/** 进行中的工作项按当前阶段分到五列；评审通过后离开队列，进入工作项的「待审核」 */
function phaseBoard(all) {
  const running = all.filter((i) => i.status === "in_progress");
  const order = (p) => (p === 0 ? 5 : p);
  return h("div", { class: "qboard" }, PHASES.map((ph) => {
    const hot = (i) => (i.labels.includes("hotfix") ? 0 : 1);
    const items = running.filter((i) => (i.phase ?? "understand") === ph.id).sort((a, b) => hot(a) - hot(b) || order(a.priority) - order(b.priority));
    return h("div", { class: "bcol qcol" },
      h("div", { class: "bcol-head" }, h("span", { class: "qdot q-" + ph.id }), h("span", {}, ph.label), h("span", { class: "count" }, items.length)),
      h("div", { class: "bcol-body" }, items.length ? items.map((i) => {
        const cur = i.phases.filter((r) => r.result === "active").at(-1);
        const fixes = i.phases.filter((r) => r.cycle === i.cycle && r.phase === "test" && r.result === "fail").length;
        const prevFail = i.phases.filter((r) => r.cycle === i.cycle - 1 && r.result === "fail").at(-1);
        return h("div", { class: "icard running", onclick: () => { location.hash = "#issue=" + i.key; } },
          h("div", { class: "icard-top" }, pbadge({ key: i.projectKey }), h("span", { class: "ikey" }, i.key),
            i.labels.includes("hotfix") ? h("span", { class: "label hot" }, "⚡ HOTFIX") : null, h("span", { style: "margin-left:auto" }, avatar(i.assignee))),
          h("div", { class: "ititle" }, i.title),
          h("div", { class: "imeta" },
            i.cycle > 1 ? h("span", { class: "cycle-tag warn", title: prevFail ? `上轮${phaseLabel(prevFail.phase)}未通过：${prevFail.note}` : "" }, `第 ${i.cycle} 轮`) : null,
            fixes ? h("span", { class: "cycle-tag warn" }, `测试返工 ${fixes} 次`) : null,
            typeof auto !== "undefined" && auto.stuck(i.key) ? h("span", { class: "cycle-tag warn", style: "color:var(--failed)" }, `⚠ 哨兵处理中（${auto.stuck(i.key).level} 次）`) : null,
            cur ? h("span", { class: "muted", style: "font-size:11.5px;margin-left:auto" }, `本阶段 ${ago(cur.startedAt).replace("前", "")}`) : null),
          miniSteps(i));
      }) : h("div", { class: "bcol-empty" }, "空闲")));

const butler = { get msgs() { return S.butler; } };
/** 卡片（拆分计划等）的编辑会延迟同步到服务端 */
let butlerSaveT = null;
function saveButler() {
  clearTimeout(butlerSaveT);
  butlerSaveT = setTimeout(() => S.butler.forEach((m, i) => { if (m.card) rpc("assistant.updateCard", i, m.card).catch(() => {}); }), 300);
}
let butlerBusy = false;
const BUTLER_SUGGESTS = ["汇总一下各项目进展", "官网要加一个博客模块，支持 Markdown 和标签", "把 WEB-3 优先级调成紧急", "开启官网改版的持续迭代"];
/** 按项目前缀匹配的关键词（示例项目）；其他项目按名称或前缀匹配 */
const PROJ_HINTS = { WEB: /官网|网站|首页|页面|博客|seo|定价|移动端|web/i, HUB: /调度|智能体|平台|hub|任务中心|重试|队列|看板/i, KB: /知识库|内部文档|kb/i };

function detectProject(text) {
  const ps = issuesApi.projects();
  for (const p of ps) if (text.includes(p.name) || new RegExp(`\\b${p.key}\\b`, "i").test(text)) return p;
  for (const p of ps) if (PROJ_HINTS[p.key]?.test(text)) return p;
  return null;
}
const PRIO_WORDS = [[/紧急/, 1], [/高/, 2], [/中/, 3], [/低/, 4]];

/** 本地规则回复：演示模式或没有可用模型时使用（正常情况下由服务端的 Claude 回答） */
async function butlerReply(text) {
  const all = await issuesApi.list();
  const lastPlan = [...butler.msgs].reverse().find((m) => m.card?.type === "plan");

  // 1. 确认上一份计划
  if (lastPlan && !lastPlan.card.created && /^(确认|可以|好的?|没问题|创建|就这样|ok)/i.test(text.trim())) {
    const keys = await createPlan(lastPlan.card);
    return { text: `已创建 ${keys.join("、")}。${lastPlan.card.startNow ? "有负责人的已进入待办并开始执行，" : "都放在「待规划」，"}可以在任务中心看执行进度。` };
  }

  // 2. 进展汇总
  if (/进展|状态|汇总|怎么样|情况|概况/.test(text) && !/[A-Za-z]{2,6}-\d+/.test(text)) {
    const att = issuesApi.attention();
    const lines = issuesApi.projects().map((p) => {
      const its = all.filter((i) => i.projectId === p.id);
      const run = its.filter((i) => i.status === "in_progress");
      const phaseTxt = run.map((i) => `${i.key} ${phaseLabel(i.phase) ?? ""}`).join("、");
      return `【${p.name}】进行中 ${run.length}${phaseTxt ? `（${phaseTxt}）` : ""}，待验收 ${p.counts.review}，负责人：${{ off: "关闭", on_demand: "按需", autopilot: "持续迭代" }[p.lead?.mode ?? "off"]}`;
    });
    return { text: `${lines.join("\n")}\n\n${att.length ? `需要你处理 ${att.length} 件：\n${att.slice(0, 5).map((a) => `· ${a.issue.key} ${a.issue.title}：${a.text}`).join("\n")}` : "目前没有需要你处理的事项。"}` };
  }

  // 2.5 Hotfix
  if (/hotfix|紧急修复|线上.*(问题|故障|bug|挂了|报错)|马上修/i.test(text) && !/[A-Za-z]{2,6}-\d+/.test(text)) {
    const p = detectProject(text) ?? curProject();
    const title = text.replace(/hotfix|请?(帮我)?(紧急修复|马上修)一下?/gi, "").replace(/[\s，,。！!、]+$/, "").trim().slice(0, 40) || "紧急修复";
    return { text: `收到，这是紧急问题。我会在「${p.name}」创建 Hotfix，指派给 developer，创建后直接进入「进行中」开始处理，照常走完测试和评审。确认吗？`,
      card: { type: "action", label: `⚡ Hotfix · ${p.key}：${title}`, op: "hotfix", args: { projectId: p.id, title, description: `来源：与管家的对话\n${text}` } } };
  }

  // 3. 负责人模式
  const leadOn = /(开启|打开|启动|恢复).*(持续|自动|迭代)/.test(text);
  const leadOff = /(关闭|停止|暂停).*(持续|自动|迭代|负责人)/.test(text);
  if (leadOn || leadOff) {
    const p = detectProject(text) ?? curProject();
    const mode = leadOn ? "autopilot" : "off";
    return { text: `${leadOn ? "开启后，负责人会持续巡检「" + p.name + "」：分诊新 issue、修 bug、提出并推进改进项，每天最多 " + p.lead.dailyRuns + " 次运行。" : "关闭后，负责人不再主动处理「" + p.name + "」。"}确认执行吗？`,
      card: { type: "action", label: `${p.name}：负责人${leadOn ? "开启持续迭代" : "关闭"}`, op: "lead", args: { projectId: p.id, mode } } };
  }

  // 4. 调整某个工作项
  const ref = /([A-Za-z]{2,6})-(\d+)/.exec(text);
  if (ref) {
    const k = `${ref[1].toUpperCase()}-${ref[2]}`;
    const it = all.find((i) => i.key === k);
    if (!it) return { text: `没找到 ${k}，确认一下编号？` };
    const agent = agentNames().find((n) => text.includes(n));
    const pw = PRIO_WORDS.find(([re]) => re.test(text.replace(/优先级/g, "")));
    if (/优先级|紧急/.test(text) && pw) return { text: `把 ${k}「${it.title}」的优先级改为「${IS.priorities[pw[1]]}」？`, card: { type: "action", label: `${k} 优先级 → ${IS.priorities[pw[1]]}`, op: "update", args: { key: k, patch: { priority: pw[1] } } } };
    if (agent) return { text: `把 ${k} 交给 ${agent}，并放入待办立即开始执行？`, card: { type: "action", label: `${k} 指派给 ${agent} 并开始`, op: "update", args: { key: k, patch: { assignee: agent, status: "todo" } } } };
    if (/取消/.test(text)) return { text: `取消 ${k}「${it.title}」？`, card: { type: "action", label: `取消 ${k}`, op: "update", args: { key: k, patch: { status: "canceled" } } } };
    if (/暂停|停止|先停/.test(text)) return { text: `停止 ${k} 当前的运行，放回待规划？`, card: { type: "action", label: `停止 ${k}`, op: "update", args: { key: k, patch: { status: "backlog" } } } };
    if (/开始|运行|执行|重跑|重试/.test(text)) return { text: `让 ${it.assignee ?? "（未指派）"} 开始执行 ${k}？`, card: { type: "action", label: `运行 ${k}`, op: "run", args: { key: k } } };
    return { text: `${k}「${it.title}」\n状态：${statusOf(it.status).label}${it.phase ? `（${phaseLabel(it.phase)}阶段，第 ${it.cycle} 轮）` : ""}\n负责人：${it.assignee ?? "未指派"}　优先级：${IS.priorities[it.priority]}${it.pr ? `\nPR #${it.pr.number}：${it.pr.state === "merged" ? "已合并" : "待合并"}` : ""}\n\n要怎么调整？比如「优先级调高」「交给 developer」「先暂停」。` };
  }

  // 5. 上一份计划还没确认时，默认把消息当作补充；明确说「另外 / 新需求 / 再加一个」才算新需求
  if (lastPlan && !lastPlan.card.created && !/另外|新需求|再加一个|另一个需求|还有一个需求/.test(text)) {
    lastPlan.card.items.forEach((x) => (x.description += `\n补充：${text}`));
    lastPlan.card.note = (lastPlan.card.note ? lastPlan.card.note + "；" : "") + text;
    return { text: "已把这条补充写进上面计划里每个工作项的描述。还有要调整的吗？确认的话说「确认」或点卡片上的创建按钮。" };
  }

  // 6. 新需求 → 拆分计划
  if (text.length >= 8) {
    const p = detectProject(text) ?? curProject();
    const feat = (/(?:加|做|新增|增加|支持|实现|开发|写)(?:一个|一套|个)?([^，。,.！!？?\n]{2,18})/.exec(text)?.[1] ?? text.slice(0, 14)).trim();
    let items;
    if (/调研|分析|对比|竞品|研究/.test(text)) items = [
      { title: `${feat}：调研与资料收集`, assignee: "researcher", priority: 2, labels: ["调研"] },
      { title: `${feat}：撰写分析报告`, assignee: "writer", priority: 3, labels: ["文档"] },
      { title: `${feat}：报告评审`, assignee: "reviewer", priority: 3, labels: [] },
    ];
    else if (/文案|文章|翻译|周报|介绍/.test(text) && !/页面|功能|模块/.test(text)) items = [
      { title: `${feat}：初稿`, assignee: "writer", priority: 2, labels: ["文案"] },
      { title: `${feat}：审稿`, assignee: "reviewer", priority: 3, labels: ["文案"] },
    ];
    else items = [
      { title: `${feat}：方案设计`, assignee: "developer", priority: 2, labels: ["设计"] },
      { title: `${feat}：功能实现`, assignee: "developer", priority: 2, labels: ["开发"] },
      { title: `${feat}：测试用例与验证`, assignee: "tester", priority: 3, labels: ["测试"] },
      ...(p?.id === "p_web" || /页面|展示|文案/.test(text) ? [{ title: `${feat}：页面文案`, assignee: "writer", priority: 3, labels: ["文案"] }] : []),
    ];
    items.forEach((x) => { x.description = `来源：与管家的需求讨论\n需求：${text}`; x.on = true; });
    return {
      text: `我理解的需求是：${feat}。\n建议放在「${p?.name ?? "当前项目"}」，先拆成 ${items.length} 个工作项（见下方卡片，标题、负责人、优先级都可以直接改）。\n\n还想确认两点：\n1. 有没有必须满足的验收标准，比如性能、兼容的浏览器或设备？\n2. 这次要不要一起上线，还是先做方案评审？\n\n直接回答即可，我会补进工作项描述；没问题就说「确认」。`,
      card: { type: "plan", projectId: p?.id, items, startNow: false, created: false },
    };
  }
  return { text: "可以多说一点吗？比如要做什么、属于哪个项目、希望什么时候完成。\n也可以让我：汇总各项目进展、调整某个工作项（如「把 WEB-3 优先级调成紧急」）、开启或关闭某个项目的持续迭代。" };
}

async function createPlan(card) {
  const keys = [];
  for (const x of card.items.filter((x) => x.on && x.title.trim())) {
    const i = await issuesApi.create({ projectId: card.projectId, title: x.title.trim(), description: x.description, priority: Number(x.priority), assignee: x.assignee || null, labels: x.labels, status: card.startNow ? undefined : "backlog", github: !!issuesApi.project(card.projectId)?.repo && issuesApi.project(card.projectId).sync.pushNew });
    keys.push(i.key);
  }
  card.created = keys;
  saveButler();
  return keys;
}
async function runAction(card) {
  try {
    if (card.op === "update") await issuesApi.update(card.args.key, card.args.patch);
    if (card.op === "run") await issuesApi.run(card.args.key);
    if (card.op === "lead") await issuesApi.setLead(card.args.projectId, { mode: card.args.mode });
    if (card.op === "hotfix") {
      const p = issuesApi.project(card.args.projectId);
      const i = await issuesApi.create({ ...card.args, assignee: "developer", hotfix: true, github: !!p?.repo && ["two_way", "push"].includes(p.sync.mode) });
      card.label += `（${i.key}）`;
    }
    card.done = true;
    saveButler();
    renderHome();
    toast(`已执行：${card.label}`, "ok");
  } catch (e) { fail(e); }
}

function planCard(m) {
  const c = m.card;

async function sendButler(text) {
  text = (text ?? "").trim();
  if (!text || butlerBusy) return;
  S.butler.push({ role: "me", text });
  butlerBusy = true;
  const inp = $("#homeInput");
  if (inp) inp.value = "";
  renderHome();
  try {
    const r = await rpc("assistant.butler", text);
    if (r?.fallback) {
      S.butler.pop();
      const reply = await butlerReply(text);
      await rpc("assistant.append", { role: "me", text });
      await rpc("assistant.append", { role: "ai", ...reply });
    }
  } catch (e) { fail(e); }
  butlerBusy = false;
  await refreshState();
  renderHome();
}

/** 需求质量评估（服务端返回的 quality 优先；新建草稿等没有 quality 时在本地计算，规则与服务端一致） */
function assessRequirement(i) {
  if (i.quality) return i.quality;
  const d = `${i.title}\n${i.description ?? ""}`;
  const lines = (i.description ?? "").split("\n").map((l) => l.trim());
  const bullets = lines.filter((l) => /^[-*·]|^\d+[.、]/.test(l)).map((l) => l.replace(/^[-*·]\s*|^\d+[.、]\s*/, ""));
  const hasCriteria = /验收|标准|应当|必须|需要满足/.test(d) && bullets.length >= 2;
  const dims = [
    { name: "目标清晰", ok: i.title.length >= 4, tip: "一句话说明要达成什么" },
    { name: "验收标准", ok: hasCriteria, tip: "列出可逐条验证的标准" },
    { name: "边界与异常", ok: /异常|失败|错误|超时|边界|为空|最多|最少|兼容/.test(d), tip: "失败、为空、超时等情况怎么处理" },
    { name: "范围", ok: /范围|不包括|仅|只|页面|模块|接口/.test(d), tip: "改哪些地方、不改哪些地方" },
    { name: "可测性", ok: /\d/.test(i.description ?? "") || hasCriteria, tip: "有具体数值或可观察的结果" },
  ];
  const w = [15, 35, 20, 15, 15];
  const score = Math.round(dims.reduce((s, x, n) => s + (x.ok ? w[n] : 0), 0) + Math.min(10, (i.description ?? "").length / 20));
  const criteria = hasCriteria ? bullets.slice(0, 6) : [
    `${i.title.replace(/[：:].*$/, "")}的主流程可以正常完成`,
    "异常输入或失败时有明确提示",
    "页面无控制台报错，关键接口无 5xx",
  ];
  const questions = dims.filter((x) => !x.ok).map((x) => ({ 目标清晰: "这项工作最终要达成什么效果？", 验收标准: "做到什么程度算完成？请列出 2–5 条可验证的标准", 边界与异常: "失败、为空、超时等情况应该怎么处理？", 范围: "涉及哪些页面或模块？有没有明确不做的部分？", 可测性: "有没有具体数值，比如性能、数量、兼容的设备？" }[x.name]));
  return { score: Math.min(100, score), dims, criteria, aiCriteria: !hasCriteria, questions };
}

// ======================= 自动化：哨兵 + 定时任务 =======================
const auto = (() => {
  // ---------- cron：支持 分 时 日 月 周 的常见写法（* / 数字 / */N / 逗号列表） ----------
  const match = (f, v) => f === "*" || f.split(",").some((p) => (p.startsWith("*/") ? v % Number(p.slice(2)) === 0 : Number(p) === v));
  function nextRun(cron, from = new Date()) {
    const [mi, ho, dm, mo, dw] = cron.trim().split(/\s+/);
    const d = new Date(from);
    d.setSeconds(0, 0);
    d.setMinutes(d.getMinutes() + 1);
    for (let n = 0; n < 60 * 24 * 370; n++) {
      if (match(mi, d.getMinutes()) && match(ho, d.getHours()) && match(dm, d.getDate()) && match(mo, d.getMonth() + 1) && match(dw, d.getDay())) return d;
      d.setMinutes(d.getMinutes() + 1);
    }
    return null;
  }
  function describe(cron) {
    const [mi, ho, , , dw] = cron.split(/\s+/);
    const W = "日一二三四五六";
    if (cron === "* * * * *") return "每分钟";
    if (/^\*\/\d+$/.test(mi) && ho === "*") return `每 ${mi.slice(2)} 分钟`;
    if (ho === "*" && /^\d+$/.test(mi)) return `每小时第 ${mi} 分`;
    if (/^\d+$/.test(ho) && /^\d+$/.test(mi)) return `${dw === "*" ? "每天" : `每周${dw.split(",").map((x) => W[x]).join("、")}`} ${ho.padStart(2, "0")}:${mi.padStart(2, "0")}`;
    return cron;
  }

  return {
    get: () => S.auto,
    onChange: (fn) => dataListeners.add(fn),
    describe, nextRun,
    stuck: (key) => (S.auto.state?.[key]?.level ? S.auto.state[key] : null),
    run: (id) => act("auto.run", id),
    saveJob: (j) => act("auto.saveJob", j),
    toggle: (id, on) => act("auto.toggle", id, on),
    remove: (id) => act("auto.remove", id),
    setRule: (k, p) => act("auto.setRule", k, p),
  };
})();

          table(["智能体", "运行次数", "花费", "占比"], byAgent.map((x) => row([h("span", { class: "who" }, avatar(x.a), x.a), x.n, usd(x.v), h("span", { class: "row", style: "gap:8px" }, bar(total ? x.v / total : 0), pct(x.v, total))]))))),
      h("div", { class: "center-block" }, h("div", { class: "bh" }, "花费最高的工作项"),
        table(["工作项", "状态", "轮次", "运行", "花费"], top.filter((i) => i.cost > 0).map((i) => row([h("span", {}, h("span", { class: "ikey" }, i.key), " ", i.title), statusOf(i.status).label, i.cycle || "—", i.runs, usd(i.cost)], i.key)))),
    ];
  }
  fill($("#insightsPage"),
    h("div", { class: "center-head" }, h("h2", {}, "洞察"),
      h("div", { class: "seg" }, [["metrics", "度量与复盘"], ["cost", "成本"]].map(([v, l]) => h("button", { class: ins.tab === v ? "on" : "", onclick: () => { ins.tab = v; renderInsights(); } }, l))),
      demoFlag()),
    body);
}
issuesApi.onChange(() => { if (viewActive("insights")) debounce("insights", renderInsights, 400); });

/** 链接锚点路由：#issue=HUB-3 / #task=<id> / #view=bus（支持在页面内切换） */
async function route() {
  const hash = location.hash;
  const tab = showView;
  const issue = /issue=([\w-]+)/.exec(hash);
  const task = /task=([\w-]+)/.exec(hash);
  const view = /view=(\w+)/.exec(hash);
  closeModal();
  if (issue) { tab("issues"); history.replaceState(null, "", "#issue=" + issue[1]); openIssue(issue[1]); return; }
  if (ui.openKey) closeDrawer();
  if (task) {
    tab("tasks");
    try { const t = await api(`/tasks/${task[1]}`); selectRoot(t.rootId, t.id); } catch {}
    return;
  }
  if (view) tab(view[1]);
}
window.addEventListener("hashchange", route);

(async () => {
  try { await refreshState(); } catch (e) { console.error(e); }
  connect();
  initIssues();
  await loadAll();
  renderAssigneeFilter();
  renderBoard();
})();
setInterval(() => { if (state.tree && state.tree.status === "running") renderTree(); }, 5000);
</script>
